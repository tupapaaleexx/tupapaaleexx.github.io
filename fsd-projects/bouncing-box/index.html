<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      .box {
        width: 70px;
        height: 70px;
        background-color: teal;
        font-size: 300%;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        left: 0;
        line-height: 70px;
        cursor: pointer;
      }

      .board {
        height: 100vh;
        width: 100%;
        position: relative;
      }
    </style>
  </head>

  <body class="board">
    <div class="box">?</div>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        var box = jQuery(".box");
        var board = jQuery(".board");
        var boardWidth = board.width();

        var positionX = 0;
        var points = 0;
        var speed = 10;

        function moveBoxTo(newPositionX) {
          box.css("left", newPositionX + "px");
        }

        function changeBoxText(newText) {
          box.text(newText);
        }

        function handleBoxClick() {
          points += 1;
          positionX = 0;
          speed = 3 * points + 10;
          changeBoxText(points);
          moveBoxTo(positionX);
        }

        function update() {
          moveBoxTo(positionX);

          positionX += speed;

          if (positionX <= 0) {
            positionX = 0;
            speed = Math.abs(speed);
          }

          if (positionX + box.width() >= boardWidth) {
            positionX = boardWidth - box.width();
            speed = -Math.abs(speed);
          }
        }

        jQuery(window).on("resize", function () {
          boardWidth = board.width();

          if (positionX + box.width() > boardWidth) {
            positionX = boardWidth - box.width();
          }

          moveBoxTo(positionX);
        });

        box.on("click", handleBoxClick);
        setInterval(update, 50);
      })();
    </script>
  </body>
</html>
